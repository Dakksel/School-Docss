<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JOO High School — Документы для аттестации</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1b2133;--muted:#6b7288;--accent:#2457d6;--line:#e3e6ef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131c;--card:#181c28;--text:#eef0f7;--muted:#98a0b8;--accent:#6f9bff;--line:#262c3d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
header{background:var(--accent);color:#fff;padding:36px 20px 28px;text-align:center}
header h1{margin:0 0 6px;font-size:clamp(1.5rem,5vw,2.3rem)}
header p{margin:0;opacity:.9}
main{max-width:960px;margin:0 auto;padding:18px 16px 50px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
input{flex:1;min-width:200px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:1rem}
.count{color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
a.doc{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-decoration:none;color:inherit;transition:transform .12s,border-color .12s}
a.doc:hover{transform:translateY(-2px);border-color:var(--accent)}
.num{flex:none;width:42px;height:42px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
.t{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.s{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.dl{flex:none;font-size:1.3rem}
a.doc.off{opacity:.45;pointer-events:none}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:20px}
</style>
</head>
<body>
<header>
  <h1>JOO High School</h1>
  <p>Документация к аттестации — нажмите на документ, чтобы скачать</p>
</header>
<main>
  <div class="bar">
    <input id="q" type="search" placeholder="Поиск по названию или номеру…">
    <span class="count" id="count"></span>
  </div>
  <div class="grid" id="grid"></div>
</main>
<footer>© JOO High School</footer>
<script src="documents.js"></script>
<script>
const grid=document.getElementById('grid'),q=document.getElementById('q'),count=document.getElementById('count');
const missing=new Set();
function ext(f){return (f.split('.').pop()||'').toUpperCase()}
function render(){
  const s=q.value.trim().toLowerCase();
  const list=DOCS.filter(d=>!s||d.title.toLowerCase().includes(s)||String(d.n)===s);
  grid.innerHTML='';
  list.forEach(d=>{
    const a=document.createElement('a');
    a.className='doc'+(missing.has(d.file)?' off':'');
    a.href=d.file;
    a.setAttribute('download', d.title+'.'+ext(d.file).toLowerCase());
    a.innerHTML=`<div class="num">${d.n}</div><div class="t">${d.title}<span class="s">${ext(d.file)}${missing.has(d.file)?' · скоро':''}</span></div><div class="dl">⬇</div>`;
    grid.appendChild(a);
  });
  count.textContent=list.length+' из '+DOCS.length;
}
q.addEventListener('input',render);
render();
// помечаем файлы, которые ещё не загружены
if(location.protocol!=='file:'){
  Promise.all(DOCS.map(d=>fetch(d.file,{method:'HEAD'}).then(r=>{if(!r.ok)missing.add(d.file)}).catch(()=>missing.add(d.file)))).then(render);
}
</script>
</body>
</html>
